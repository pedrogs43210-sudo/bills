<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FF7059" />
    <title>Billy</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Flat #b83e1a, compact drawing, no tile: at 16px a gradient chip is a smudge, and the
         accent proper is 3.67:1 where this has to survive against unknown browser chrome. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
  </head>
  <script>
      // Applied before first paint so the app never flashes the wrong theme. Mirrors
      // resolveTheme() in src/lib/theme.ts; kept tiny and failure-tolerant on purpose.
      try {
        var c = localStorage.getItem("bills.theme.v1");
        document.documentElement.dataset.theme =
          c === "light" || c === "dark"
            ? c
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
