name: Native builds

# Proves the iOS and Android projects actually compile. Neither can be built on the Windows
# machine this is developed on — Android needs a JDK and the Android SDK, iOS needs macOS and
# Xcode — so this workflow is the only place we find out before submission day.
#
# Neither build is signed. Signing needs the store accounts, and an unsigned build still catches
# everything that matters at this stage: a broken project file, a missing asset, a plugin that
# does not compile.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # Capacitor 8 targets compileSdk 36, which a runner will not install by itself: Gradle can
      # download a platform but not accept its licence, so the build dies at the APK step.
      - uses: android-actions/setup-android@v3
      - name: Install the SDK this project compiles against
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The native bundle deliberately has no service worker: the assets are already inside the
      # app, and a stale cache would survive a store update.
      - run: npm run build:native
        env:
          # Set these two as repository secrets and the built app scans through the proxy instead
          # of asking each user for their own Anthropic key. Leave them unset and nothing changes:
          # the build simply keeps the own-key behaviour, so this is a switch, not a cutover.
          VITE_SCAN_PROXY_URL: ${{ secrets.VITE_SCAN_PROXY_URL }}
          VITE_APP_LINK: https://splitwithbilly.com
          VITE_APP_TOKEN: ${{ secrets.VITE_APP_TOKEN }}
          # RevenueCat's PUBLIC SDK keys, one per store. Public is accurate — they identify the app
          # to RevenueCat and are meant to ship inside the binary, unlike VITE_APP_TOKEN. They are
          # secrets here so a fork does not inherit them and either can be rotated without a commit.
          # Leave them unset and the build simply says packs are not ready to buy.
          VITE_RC_KEY_IOS: ${{ secrets.VITE_RC_KEY_IOS }}
          VITE_RC_KEY_ANDROID: ${{ secrets.VITE_RC_KEY_ANDROID }}
      - run: npx cap sync android
      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"
        working-directory: android
      # Raw job logs need admin rights on the repository, which the person debugging this may not
      # have. Annotations are readable through the public API, so the failure is republished as
      # annotations rather than left somewhere only an owner can look.
      - name: Republish the failure where it can be read
        if: failure()
        run: |
          log="$RUNNER_TEMP/gradle.log"
          [ -f "$log" ] || { echo "::error::gradle produced no log"; exit 0; }
          grep -nE "FAILURE:|What went wrong|error:|Caused by|^> |Execution failed|Could not (find|resolve|determine)" "$log" \
            | tail -n 25 > "$RUNNER_TEMP/interesting.txt" || true
          if [ ! -s "$RUNNER_TEMP/interesting.txt" ]; then
            tail -n 25 "$log" > "$RUNNER_TEMP/interesting.txt"
          fi
          while IFS= read -r line; do
            printf '::error::%s\n' "${line//$'\r'/}"
          done < "$RUNNER_TEMP/interesting.txt"
      - uses: actions/upload-artifact@v5
        with:
          name: bills-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:native
        env:
          # Set these two as repository secrets and the built app scans through the proxy instead
          # of asking each user for their own Anthropic key. Leave them unset and nothing changes:
          # the build simply keeps the own-key behaviour, so this is a switch, not a cutover.
          VITE_SCAN_PROXY_URL: ${{ secrets.VITE_SCAN_PROXY_URL }}
          VITE_APP_LINK: https://splitwithbilly.com
          VITE_APP_TOKEN: ${{ secrets.VITE_APP_TOKEN }}
          # RevenueCat's PUBLIC SDK keys, one per store. Public is accurate — they identify the app
          # to RevenueCat and are meant to ship inside the binary, unlike VITE_APP_TOKEN. They are
          # secrets here so a fork does not inherit them and either can be rotated without a commit.
          # Leave them unset and the build simply says packs are not ready to buy.
          VITE_RC_KEY_IOS: ${{ secrets.VITE_RC_KEY_IOS }}
          VITE_RC_KEY_ANDROID: ${{ secrets.VITE_RC_KEY_ANDROID }}
      - run: npx cap sync ios
      # What the runner actually is. macos-latest moves without notice, and when this job goes red
      # the first question is always "did the toolchain change under us" — which is unanswerable
      # after the fact unless the answer is printed on every run, green ones included.
      - name: Say what we are building with
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i simulator || true
        working-directory: ios/App
      - name: Build for simulator, unsigned
        run: |
          set -o pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
        working-directory: ios/App
      # The same trick the android job has used since it was written, and the reason this one was
      # diagnosable and iOS was not: raw job logs need admin rights on the repository, annotations
      # are readable through the public API. A failure nobody can read is a failure nobody can fix.
      - name: Republish the failure where it can be read
        if: failure()
        run: |
          log="$RUNNER_TEMP/xcodebuild.log"
          [ -f "$log" ] || { echo "::error::xcodebuild produced no log"; exit 0; }
          grep -nE "error:|BUILD FAILED|The following build commands failed|Undefined symbol|No such module|does not contain|Signing for|xcodebuild: error|is not available" "$log" \
            | tail -n 25 > "$RUNNER_TEMP/interesting.txt" || true
          if [ ! -s "$RUNNER_TEMP/interesting.txt" ]; then
            tail -n 25 "$log" > "$RUNNER_TEMP/interesting.txt"
          fi
          while IFS= read -r line; do
            printf '::error::%s\n' "${line//$'\r'/}"
          done < "$RUNNER_TEMP/interesting.txt"
      # Keeps the whole log for anyone who does have access, so the annotations above never have to
      # be the only copy.
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: ios-xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: warn
