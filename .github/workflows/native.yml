name: Native builds

# Proves the iOS and Android projects actually compile. Neither can be built on the Windows
# machine this is developed on — Android needs a JDK and the Android SDK, iOS needs macOS and
# Xcode — so this workflow is the only place we find out before submission day.
#
# Neither build is signed. Signing needs the store accounts, and an unsigned build still catches
# everything that matters at this stage: a broken project file, a missing asset, a plugin that
# does not compile.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Capacitor 8 targets compileSdk 36, which a runner will not install by itself: Gradle can
      # download a platform but not accept its licence, so the build dies at the APK step.
      - uses: android-actions/setup-android@v3
      - name: Install the SDK this project compiles against
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The native bundle deliberately has no service worker: the assets are already inside the
      # app, and a stale cache would survive a store update.
      - run: npm run build:native
      - run: npx cap sync android
      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"
        working-directory: android
      # Raw job logs need admin rights on the repository, which the person debugging this may not
      # have. Annotations are readable through the public API, so the failure is republished as
      # annotations rather than left somewhere only an owner can look.
      - name: Republish the failure where it can be read
        if: failure()
        run: |
          log="$RUNNER_TEMP/gradle.log"
          [ -f "$log" ] || { echo "::error::gradle produced no log"; exit 0; }
          grep -nE "FAILURE:|What went wrong|error:|Caused by|^> |Execution failed|Could not (find|resolve|determine)" "$log" \
            | tail -n 25 > "$RUNNER_TEMP/interesting.txt" || true
          if [ ! -s "$RUNNER_TEMP/interesting.txt" ]; then
            tail -n 25 "$log" > "$RUNNER_TEMP/interesting.txt"
          fi
          while IFS= read -r line; do
            printf '::error::%s\n' "${line//$'\r'/}"
          done < "$RUNNER_TEMP/interesting.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: bills-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:native
      - run: npx cap sync ios
      - name: Build for simulator, unsigned
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: ios/App
