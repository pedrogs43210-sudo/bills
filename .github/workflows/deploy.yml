name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Set these two as repository secrets and the built app scans through the proxy instead
          # of asking each user for their own Anthropic key. Leave them unset and nothing changes:
          # the build simply keeps the own-key behaviour, so this is a switch, not a cutover.
          VITE_SCAN_PROXY_URL: ${{ secrets.VITE_SCAN_PROXY_URL }}
          VITE_APP_TOKEN: ${{ secrets.VITE_APP_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
