<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Billy">
  <!--
    Billy's mark, tiled. Two rounded bars, one short — an equals sign that isn't equal.

    BOTH BARS ARE INK, and that is a rule rather than a choice. Cream on this gradient measures
    2.58:1 at the coral end and 1.69:1 at the amber; ink holds 4.92:1 and 7.51:1 across the whole
    sweep. The two-colour split (ink + accent) lives on flat cream and flat dark only.

    Drawn at 72% of the tile width because nothing masks this one. Anything that IS masked — the
    Android adaptive foreground, the PWA maskable icon — is drawn at 58.5% instead: an 11:6
    rectangle has a half-diagonal of 25.06 units against the safe circle's radius of 21.33.
    See scripts/make-assets.mjs, which computes both from the same numbers.

    This is the TILED form and it belongs to the browser tab, the launcher, the store listing and
    the splash. Inside the app the mark is used flat and untiled -- see src/components/Mark.tsx.
  -->
  <defs>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7059"/><stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15.4" fill="url(#sunset)"/>
  <g transform="translate(32 32) scale(1.0473) translate(-32 -32)">
    <rect x="10" y="20" width="44" height="9" rx="4.5" fill="#3d2b24"/>
    <rect x="10" y="35" width="26" height="9" rx="4.5" fill="#3d2b24"/>
  </g>
</svg>
