<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Billy">
  <!--
    Billy's mark, tiled. One 64-unit master: body x20-50, y8-52, top corners r6, five teeth landing
    on both bottom corners, three lines knocked out with fill-rule evenodd so they take the tile's
    colour rather than being painted over it.

    This is the TILED form: gradient behind, ink mark on top. It belongs to the browser tab, the
    launcher, the store listing and the splash. Inside the app the mark is used flat and untiled --
    see src/components/Mark.tsx.
  -->
  <defs>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7059"/><stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15.4" fill="url(#sunset)"/>
  <g transform="translate(32 32) scale(0.66) translate(-32 -32)">
    <path fill="#3d2b24" fill-rule="evenodd" d="M20 8H44a6 6 0 0 1 6 6v34l-3 4-3-4-3 4-3-4-3 4-3-4-3 4-3-4-3 4-3-4V14a6 6 0 0 1 6-6Z M28 19h14a2.5 2.5 0 0 1 0 5H28a2.5 2.5 0 0 1 0-5z M28 27h9a2.5 2.5 0 0 1 0 5h-9a2.5 2.5 0 0 1 0-5z M28 35h14a2.5 2.5 0 0 1 0 5H28a2.5 2.5 0 0 1 0-5z"/>
  </g>
</svg>
