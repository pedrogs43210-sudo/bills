<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Billy">
  <!--
    The maskable form. Identical to icon.svg except the mark is drawn at 58.5% rather than 72%,
    because something is going to crop this one to a circle. An 11:6 rectangle has a half-diagonal
    of 25.06 units against the safe circle's 21.33: at 72% it reaches 26.24 and loses its corners.

    Full bleed and no baked radius — the mask supplies the shape.
  -->
  <defs>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7059"/><stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="url(#sunset)"/>
  <g transform="translate(32 32) scale(0.8509) translate(-32 -32)">
    <rect x="10" y="20" width="44" height="9" rx="4.5" fill="#3d2b24"/>
    <rect x="10" y="35" width="26" height="9" rx="4.5" fill="#3d2b24"/>
  </g>
</svg>
